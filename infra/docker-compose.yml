services:

  # ========= 元数据库容器，存放键值对，索引关系的（轻量级存储，无法存储大的原始文件）=========
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dataengine
      POSTGRES_PASSWORD: dataengine
      POSTGRES_DB: dataengine
    ports:
      - "8002:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data # 数据库数据挂载在本地当前 docker 文件的相对目录 ./postgres/data
    # ✅ 健康检查：只有当 dataengine 这个 DB 可连接时才视为 healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataengine -d dataengine || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  #  ========= minio对象存储服务，用以存储大型文件 ========= 
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z # 版本随意，可用 latest
    container_name: dataengine-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - ../data/minio:/data
    restart: unless-stopped

  #  ======== collection-gateway容器 =========
  collection-gateway:
    build:
      context: ..  # ⬅️ 构建上下文是仓库根目录 Data-Engine（ = dockerfile字段的 base-path）
      dockerfile: services/collection-gateway/Dockerfile # 查找当前目录的Dockerfile构建配置
    environment:
      # 告诉应用去连 同一个 compose 里的 postgres 服务，主机名：postgres
      DATABASE_URL: postgresql+psycopg2://dataengine:dataengine@postgres:5432/dataengine
      STORAGE_ROOT: /data/raw # FS存储方式，需要淘汰，纯粹依赖于服务器IO稳定性
      # minio 对象文件存储服务👍
      MINIO_ENDPOINT: "minio:9000"          # 服务名:端口（容器内部）
      MINIO_ACCESS_KEY: "admin"             # 前提是 docker compose up -d minio初次启动后，登录页面http://localhost:9001，创建登陆账号
      MINIO_SECRET_KEY: "admin123456"
      MINIO_SECURE: "false"                 # http
      MINIO_BUCKET_RAW: "raw"
      MINIO_BUCKET_SYNTHETIC: "synthetic"
      MINIO_BUCKET_MODELS: "models"
    volumes:
      # ✅ 挂载源码，方便热更新（改代码不重建镜像）
      - ../services/collection-gateway/app:/app/app
      - ../libs:/app/libs
      - ../data/raw:/data/raw
    depends_on:
      minio:
      postgres:
        # ✅ 等 postgres 变成 healthy 再启动 gateway
        condition: service_healthy
      
    ports:
      # ✅ 主机 8001 -> 容器 8000（你的 uvicorn 是 8000）
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # 可选：让 gateway 挂掉时自动重启
    # restart: unless-stopped
