version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dataengine
      POSTGRES_PASSWORD: dataengine
      POSTGRES_DB: dataengine
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  collection-gateway:
    build:
      context: ./services/collection-gateway
    environment:
      DATABASE_URL: postgresql+psycopg2://dataengine:dataengine@postgres:5432/dataengine
      STORAGE_ROOT: /data/raw
    volumes:
      - ./data/raw:/data/raw
      - ./libs:/app/libs
    depends_on:
      - postgres
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
