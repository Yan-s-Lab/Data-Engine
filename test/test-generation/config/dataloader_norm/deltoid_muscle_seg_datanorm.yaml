run:
  run_id: yk003_deltoid_muscle_seg_datanorm
  artifacts_root: test/test-generation/runs

dataloader:
  real_dir: test/test-generation/yk-001_arm_deltoid_muscle_seg
  image_dir: test/test-generation/yk-001_arm_deltoid_muscle_seg/images
  label_dir: test/test-generation/yk-001_arm_deltoid_muscle_seg/labels
  label_ext: .txt
  require_labels: false
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"

  naming:
    canonicalize_names: true
    services_id: yk003
    task_name: deltoid_muscle_seg
    filename_template: ${services_id}_${task_name}_${seq_id_padded}
    id_width: 4
    id_start: 1
    target_image_ext: .png
    materialize_mode: copy

pipeline:
  steps: [dataloader]
  resume_from_artifacts: true
