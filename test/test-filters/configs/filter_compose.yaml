run:
  # 本次实验的 run 名称。输出目录 = artifacts_root/run_id
  run_id: testfilter_compose
  artifacts_root: test/test-filters/runs

filter:
  # compose = 可组合过滤流程（按 stages 计算指标，再按 policy 做决策）
  mode: compose

  # 输入 jsonl；每行至少要有 sample_id/source/image_path。
  # source 通常是 real datasets 或者指 参与后续引导生成的 raw data。
  # phase1_semantic 若要启用 guided 路由，需要每行带 anchor_real_sample_id 等字段（见下方配置）。
  input_manifest: test/test-filters/generate/mixed_manifest.jsonl
  # 自动生成 input_manifest（替代手写 jsonl）。
  # 生效条件：enabled=true 且 input_manifest 不存在，或 force_rebuild=true。
  manifest_builder:
    enabled: true
    force_rebuild: false
    # 默认会写回 input_manifest；也可单独指定 output_path。
    write_output: true
    # 文件名驱动：不依赖目录语义，只把目录当扫描范围。
    # 规则：
    # 1) 匹配 synthetic.stem_pattern 的文件视作 synthetic
    # 2) 其他文件视作 real
    filename_driven:
      enabled: true
      roots:
        - test/test-filters/real_raw
        - test/test-filters/synthetic
      patterns: ["**/*.png", "**/*.jpg", "**/*.jpeg"]
      # 可选：排除运行产物目录，避免误扫。
      exclude_path_contains:
        - "/runs/"
      real:
        source: real
        sample_id_template: "{stem}_real"
      synthetic:
        source: synthetic
        sample_id_template: "{stem}"
        # 文件名固定由生成器产出，这里按控制分支 token 精确匹配（避免把 real 误判为 synthetic）。
        # 例：yk-..._0001_canny_0001 -> anchor=yk-..._0001
        stem_pattern: "^(?P<anchor>.+)_canny_[0-9]+$"
        anchor_template: "{anchor}_real"
        anchor_field: anchor_real_sample_id
        strict_anchor: true

  # true 时，source=real 的样本最终强制 accept（不会被过滤掉）。
  keep_real_always: true

  # v1 主策略是 Top-K + 审核池；阈值仅在排序策略关闭时兜底。
  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  clip:
    # embedding 与图文打分的底座模型。
    model_id: google/siglip2-base-patch16-224
    # auto: 有 CUDA 就走 GPU，否则 CPU。
    device: auto
    # raw_cosine 口径下会强制使用 cosine 计算 prompt 相似度。
    prompt_score_mode: cosine

    # 正向任务语义（用于 prompt_score / prompt_margin）。
    # Filter 侧使用短关键词句更稳（generation 可继续用长模板）。
    prompt_text: "human, upper arm, deltoid muscle, anatomically correct"

    # 负向语义（用于 margin：正向得分 - 负向最大得分）。
    negative_prompts:
      - "a collage or fragmented montage"
      - "a low quality synthetic artifact image"
      - "a drawing, painting, or cartoon"

  # v1 仅保留 prompt + anchor pair 的语义分。
  stages:
    - id: prompt_score # 图像 vs prompt 语义匹配分
      enabled: true

  # Phase1 v1：仅保留 s_anchor / s_prompt / s_final。
  phase1_semantic:
    enabled: true
    guided_w_anchor: 0.8
    guided_w_prompt: 0.2
    # score=映射到[0,1]；raw_cosine=原始余弦[-1,1]；margin_norm=正负提示词差值归一化。
    prompt_metric: raw_cosine

    # 行内 prompt 字段名；存在时覆盖 clip.prompt_text。
    prompt_field: effective_prompt_text

    # 判断 synthetic 是否 guided 用到的字段（任一字段有值即可视为 guided）。
    guided_marker_fields:
      - anchor_real_sample_id
      - anchor_real_image_path
      - effective_anchor_input
      - effective_anchor_inputs

    # paired semantic 查 anchor sid 的字段优先级。
    anchor_sid_fields:
      - anchor_real_sample_id

  policy:
    decision: phase1_v1

    # v1: guided 先过最低资格，再按 s_final 取 Top-K；其余进 uncertain。
    ranking_review:
      enabled: true
      target_source: synthetic
      rank_metric: s_final
      keep_top_k: 6
      review_rest: true
      guided_min_anchor: 0.85
      # 由 real anchor 的 prompt 分位数自动标定阈值（优先于 guided_min_prompt）。
      guided_min_prompt_from_real_quantile: q10
      guided_min_prompt: -1.0
      hard_reject: false
