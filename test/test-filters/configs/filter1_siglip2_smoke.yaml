run:
  run_id: testfilter_siglip2_smoke
  artifacts_root: test/test-filters/runs

filter:
  input_manifests:
    - test/test-filters/generate/mixed_manifest.jsonl
  anchor_real_manifest: test/test-filters/input_manifest.jsonl
  siglip2_margin_threshold: 0.0
  siglip2_baseline_labeled: artifacts/tmp/siglip2_baseline_labeled.json
  clip:
    model_id: google/siglip2-base-patch16-224
    device: auto
    compared_prompt:
      positive:
        - a photo contains person
      negative:
        - a photo with no person

pipeline:
  steps: [filter]
