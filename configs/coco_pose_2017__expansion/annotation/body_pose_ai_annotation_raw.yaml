run:
  run_id: body_pose_coco_annotation_raw
  artifacts_root: artifacts/runs/yk003/body_pose_coco

annotation:
  # Raw synthetic pool before filtering — used for the raw-synth ablation branch.
  input_manifest: artifacts/runs/yk003/body_pose_coco/body_pose_coco__prompt_canny/generate/synth_manifest.jsonl
  model: third_party/yolo26x-pose.pt
  device: "0"
  conf: 0.25
  iou: 0.45
  vis_threshold: 0.5
  val_ratio: 0.2
  seed: 42

pipeline:
  steps: [annotation]
  resume_from_artifacts: true

# Output (auto under run_dir/label/):
#   ai_labels/          — raw .txt label files (YOLO-pose format)
#   ai_dataset/         — train/val split layout + dataset.yaml
#   ai_annotations_manifest.jsonl
#   ai_annotation_report.json
