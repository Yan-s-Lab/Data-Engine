  dataset_yaml: artifacts/runs/yk003/body_pose_coco/body_pose_coco_real/label/real_dataset/dataset.yaml
  model: yolo11s-pose.pt
  epochs: 100
  imgsz: 640
  batch: 16
  device: "0"
  workers: 4
  patience: 30
