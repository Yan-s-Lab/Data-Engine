    # - name: generation
    #   tasks:
    #     - name: prompt_only
    #       config: configs/coco_pose_2017__expansion/generation/body_pose_coco__prompt.yaml
    #     - name: prompt_canny
    #       config: configs/coco_pose_2017__expansion/generation/body_pose_coco__prompt_canny.yaml

    - name: filter
      tasks:
        - name: phase1
          config: configs/coco_pose_2017__expansion/filter/body_pose_coco_filter.yaml
