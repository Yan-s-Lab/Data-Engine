run:
  run_id: m2_single_node_closed_loop_comfyui_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  backend: comfyui
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212
  comfyui:
    base_url: http://127.0.0.1:8188
    # Must be ComfyUI API prompt graph format (NOT UI workflow format).
    workflow: data/comfyui/comfyui_workflows/flux_dev.json
    # Alternative to `workflow`: inline API prompt graph object.
    # prompt_graph: {}
    # wait_mode: history | websocket
    wait_mode: history
    ws_fallback_to_history: true
    # Optional: set fixed client id for traceability.
    client_id: ""
    # Optional: pass through to /prompt payload.extra_data
    extra_data: {}
    # Optional: set these when your workflow supports seed injection.
    seed_node_id: ""
    seed_input_key: seed
    # Optional text prompt injection to a specific node input.
    # prompt:
    #   node_id: "6"
    #   input_key: text
    #   text_template: "photorealistic side-profile portrait of a person, natural skin texture, sample={sample_id}"
    # Optional real-anchor image injection (upload each anchor image to ComfyUI input and set node input).
    # anchor_image:
    #   node_id: "12"
    #   input_key: image
    #   path_field: image_path
    #   upload: true
    #   upload_overwrite: true
    #   upload_subfolder: ""
    timeout_sec: 300
    poll_interval_sec: 1.0
    max_outputs_per_job: 1

filter:
  accept_threshold: 0.58
  uncertain_low: 0.45
  uncertain_high: 0.58

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
