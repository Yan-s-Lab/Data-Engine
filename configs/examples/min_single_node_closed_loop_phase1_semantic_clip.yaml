run:
  run_id: m2_single_node_closed_loop_phase1_semantic_clip_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212

filter:
  mode: compose
  keep_real_always: true
  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  clip:
    model_id: openai/clip-vit-base-patch32
    device: auto

  stages:
    - id: semantic_anchor
      enabled: true
    - id: prompt_score
      enabled: false
    - id: prompt_margin
      enabled: false
    - id: consistency
      enabled: false
    - id: multicrop
      enabled: false
    - id: anchor_ood
      enabled: false
    - id: dedup
      enabled: false
    - id: quality
      enabled: false

  semantic_anchor:
    anchor_from_source_real: true
    reduce: median
    self_exclude_for_real: true
    min_anchor_count: 2
    max_anchor_samples: 2000

  policy:
    decision: tri_gate_plus_weighted
    calibration_sources:
      - real
    gates:
      - metric: s_semantic_anchor
        op: ">="
        threshold_from: q05_real
        buffer: 0.02
    weighted:
      final_score:
        s_semantic_anchor: 1.0

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
