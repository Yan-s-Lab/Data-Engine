run:
  # 本次生成任务的 run 标识；决定产物目录名。
  run_id: yk003_prompt_canny_demo_managed_20260225_rerun
  # 统一产物根目录，最终输出到 {artifacts_root}/{run_id}/...
  artifacts_root: artifacts/runs

generate:
  # 生成后端；当前脚本支持 basic / comfyui，这里走 ComfyUI。
  backend: comfyui
  # DataLoader 输出的真实样本清单（hard-code：硬编码路径，换 run_id/环境时需同步更新）。
  real_manifest: artifacts/runs/dataloader_norm_test_generation_yk002/dataloader/real_manifest.jsonl
  # 每个 real 样本要生成的 synthetic 数量。
  synth_per_real: 3
  # 全局生成上限（notice：demo 截断策略，当前最多只生成 20 张）。
  # max_synth_samples: 20
  # 基础随机种子；实际每个样本 seed = seed_base + sample_index。
  seed_base: 20270225
  comfyui:
    # ComfyUI HTTP API 地址。
    base_url: http://127.0.0.1:8188
    # ComfyUI API prompt graph（不是 UI workflow）JSON 路径。
    workflow: configs/examples/comfyui/flux_canny_model_example.json
    # 等待完成模式：history=轮询 /history；websocket=订阅事件后回查 history。
    wait_mode: history
    # 是否启用非阻塞并发提交。
    non_blocking: true
    # 非阻塞模式下最多并发在途任务数。
    max_inflight: 2
    # 超时策略：fail/skip/retry。
    on_timeout: retry
    # on_timeout=retry 时的最大重试次数。
    timeout_retries: 2
    # 发送给 ComfyUI 的 client_id（用于 websocket 事件关联）。
    client_id: yk003-prompt-canny
    # 工作流里要写入 seed 的节点 ID。
    seed_node_id: "3"
    # seed 节点的输入字段名。
    seed_input_key: seed
    prompt:
      # 正向提示词节点 ID（CLIPTextEncode）。
      node_id: "23"
      # 提示词写入字段名。
      input_key: text
      # 提示词模板文件路径。
      template_file: configs/examples/arm_deltoid_template.txt
      # false: 模板原样传给 ComfyUI 解析 {..}；true: 在 run_generate.py 内先做模板渲染。
      render_template: false
    filename_prefix:
      # SaveImage 节点 ID。
      node_id: "9"
      # SaveImage 文件名前缀输入字段。
      input_key: filename_prefix
      # 用于补充命名上下文（services_id/task_name 等）的 dataloader 配置。
      dataloader_config: configs/examples/dataloader_norm_test_generation_yk002.yaml
      # 输出文件前缀模板；anchor_image_stem 来自 anchor 图文件名（raw 优先）。
      template: "{anchor_image_stem}_canny"
    anchor_images:
      # 可配置多个锚点图注入；本例仅 1 路 Canny 控制图。
      - name: canny_control
        # LoadImage 节点 ID。
        node_id: "17"
        # LoadImage 的输入字段名。
        input_key: image
        # 从 real_manifest 行里读取图片路径的字段名。
        path_field: image_path
        # true: 先上传到 ComfyUI input 目录，再把返回文件名写入工作流。
        upload: true
        # 上传同名文件时是否覆盖。
        upload_overwrite: true
        # 上传子目录；空字符串表示根 input 目录。
        upload_subfolder: ""
    # 单任务超时秒数。
    timeout_sec: 1800
    # history 轮询间隔秒。
    poll_interval_sec: 1.0
    # 每个 prompt 最多下载多少张输出图。
    max_outputs_per_job: 1
    # 锚图尺寸过滤：超过阈值的 real image 直接跳过，不参与引导生成。
    anchor_filter:
      # 限制最长边；例如 1536 会跳过 3500x2333 / 3744x4959 这类大图。
      max_long_edge: 1536

pipeline:
  steps: [generate]
  resume_from_artifacts: true
