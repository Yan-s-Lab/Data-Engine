run:
  run_id: m2_single_node_closed_loop_compose_clip_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212

filter:
  mode: compose
  keep_real_always: true
  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  clip:
    model_id: openai/clip-vit-base-patch32
    device: auto
    prompt_text: "a clear photo of a dog"
    negative_prompts:
      - "a collage or fragmented montage"
      - "a low quality synthetic artifact image"
      - "a drawing, painting, or cartoon"

  # Toggle each filter stage independently.
  stages:
    - id: prompt_score
      enabled: true
    - id: prompt_margin
      enabled: true
    - id: consistency
      enabled: true
    - id: multicrop
      enabled: true
    - id: anchor_ood
      enabled: true
    - id: dedup
      enabled: true
    - id: quality
      enabled: true

  pcs:
    repeats: 3
    grid_rows: 4
    grid_cols: 4
    swap_ratio: 0.4
    min_swaps: 2
    max_swaps: 8
    seed_base: 20260214
    keep_perturbed_images: false

  multicrop:
    n_random: 6
    crop_frac: 0.45
    seed_base: 20260214

  anchor_ood:
    anchor_from_source_real: true
    threshold_quantile: 0.99
    max_anchor_samples: 2000
    eps: 1.0e-6
    diag_var_floor: 1.0e-3

  dedup:
    synthetic_only: false

  quality:
    blur_good_threshold: 80.0

  policy:
    decision: tri_gate_plus_weighted
    calibration_sources:
      - real
    gates:
      - metric: s_prompt_margin
        op: ">="
        threshold_from: q05_real
        buffer: 0.02
      - metric: s_multicrop_consistency
        op: ">="
        threshold_from: q05_real
        buffer: 0.02
      - metric: ood_md2
        op: "<="
        threshold_from: q99_real
        buffer: 1.0
    weighted:
      final_score:
        s_prompt_margin_norm: 0.40
        s_multicrop_consistency: 0.35
        ood_score: 0.25

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
