run:
  run_id: m2_single_node_closed_loop_comfyui_api_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 2

generate:
  backend: comfyui
  synth_per_real: 1
  max_synth_samples: 2
  seed_base: 20260212
  comfyui:
    base_url: http://127.0.0.1:8188
    workflow: configs/examples/comfyui/flux_dev_api_img2img.json
    wait_mode: history
    ws_fallback_to_history: true
    client_id: data-engine-api-demo
    extra_data: {}
    seed_node_id: "25"
    seed_input_key: noise_seed
    prompt:
      node_id: "6"
      input_key: text
      text_template: "photorealistic side-profile portrait, natural skin texture, realistic lighting, anchor sample {sample_id}"
    anchor_image:
      node_id: "40"
      input_key: image
      path_field: image_path
      upload: true
      upload_overwrite: true
      upload_subfolder: ""
    timeout_sec: 300
    poll_interval_sec: 1.0
    max_outputs_per_job: 1

filter:
  accept_threshold: 0.58
  uncertain_low: 0.45
  uncertain_high: 0.58

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
