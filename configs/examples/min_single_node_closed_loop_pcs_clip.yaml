run:
  run_id: m2_single_node_closed_loop_pcs_clip_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212

filter:
  mode: pcs_clip
  clip_model_id: openai/clip-vit-base-patch32
  accept_threshold: 0.78
  uncertain_low: 0.70
  uncertain_high: 0.78
  pcs:
    device: auto
    repeats: 4
    grid_rows: 4
    grid_cols: 4
    swap_ratio: 0.4
    min_swaps: 2
    max_swaps: 8
    seed_base: 20260214
    synthetic_only: true
    keep_real_always: true
    keep_perturbed_images: false

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
