run:
  run_id: m2_single_node_closed_loop_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212

filter:
  accept_threshold: 0.58
  uncertain_low: 0.45
  uncertain_high: 0.58

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
