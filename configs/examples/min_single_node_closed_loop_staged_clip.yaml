run:
  run_id: m2_single_node_closed_loop_staged_clip_demo
  artifacts_root: artifacts/runs

pipeline:
  steps:
    - dataloader
    - generate
    - filter
    - train
    - eval

dataloader:
  real_dir: data/raw/collection_1
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
  max_samples: 3

generate:
  synth_per_real: 2
  max_synth_samples: 6
  seed_base: 20260212

filter:
  mode: staged_clip
  strategy: tri_gate
  keep_real_always: true
  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  clip:
    model_id: openai/clip-vit-base-patch32
    device: auto
    prompt_text: "a clear photo of a dog"
    negative_prompts:
      - "a collage or fragmented montage"
      - "a low quality synthetic artifact image"
      - "a drawing, painting, or cartoon"

  pcs:
    repeats: 3
    grid_rows: 4
    grid_cols: 4
    swap_ratio: 0.4
    min_swaps: 2
    max_swaps: 8
    seed_base: 20260214
    keep_perturbed_images: false

  multicrop:
    n_random: 6
    crop_frac: 0.45
    seed_base: 20260214

  anchor_ood:
    anchor_from_source_real: true
    threshold_quantile: 0.99
    max_anchor_samples: 2000
    eps: 1.0e-6
    diag_var_floor: 1.0e-3

  tri_gate:
    calibration_sources:
      - real
    clip_margin_q: 0.05
    multicrop_q: 0.05
    ood_q: 0.99
    clip_margin_buffer: 0.02
    multicrop_buffer: 0.02
    ood_buffer: 1.0
    keep_real_always: true

  dedup:
    synthetic_only: false

  quality:
    blur_good_threshold: 80.0

  score:
    w_prompt: 0.30
    w_consistency: 0.35
    w_multicrop: 0.0
    w_dedup: 0.20
    w_blur: 0.10
    w_exposure: 0.05
    w_ood: 0.0

train:
  model_name: stub_detector_v1_single_node
  max_train_samples: 8

eval:
  hard_case_topk: 5
  target_map50: 0.72
