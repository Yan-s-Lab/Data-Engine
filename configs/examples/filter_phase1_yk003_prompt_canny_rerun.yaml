run:
  run_id: yk003_prompt_canny_demo_managed_20260225_2_rerun_filter_phase1_20260226
  artifacts_root: artifacts/user_runs

filter:
  mode: compose
  input_manifest: artifacts/runs/yk003_prompt_canny_demo_managed_20260225_2_rerun/generate/mixed_manifest.jsonl
  auto_input_from_generate_mixed: false
  keep_real_always: true

  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  clip:
    model_id: google/siglip2-base-patch16-224
    device: auto
    prompt_score_mode: cosine
    prompt_template_file: arm_deltoid_template.txt
    negative_prompts:
      - dog, canine, animal, fur, snout, paw, four-legged body
      - non-human limb, creature anatomy, fantasy anatomy
      - cartoon, drawing, painting, illustration, CGI, 3d render
      - blurry, low-resolution, heavy artifacts, over-smoothed

  phase1_semantic:
    enabled: true
    guided_w_anchor: 0.8
    guided_w_prompt: 0.2
    prompt_metric: raw_cosine
    prompt_field: effective_prompt_text
    guided_marker_fields:
      - guide_image_id
      - anchor_real_image_path
      - effective_anchor_input
      - effective_anchor_inputs
    anchor_sid_fields:
      - guide_image_id

  phase1_dual_signal:
    enabled: true
    target_source: synthetic
    prompt_accept_threshold: 0.72
    prompt_uncertain_threshold: 0.62
    pair_accept_threshold: 0.85
    pair_uncertain_threshold: 0.75
    missing_pair_policy: uncertain
    hard_reject: false

  policy:
    decision: phase1_dual_signal
