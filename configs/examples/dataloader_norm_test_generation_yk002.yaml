run:
  run_id: dataloader_norm_test_generation_yk002
  artifacts_root: artifacts/runs

dataloader:
  real_dir: artifacts/datasets/rawdatasets/real_arm_deltoid
  image_dir: artifacts/datasets/rawdatasets/real_arm_deltoid/images
  label_dir: artifacts/datasets/rawdatasets/real_arm_deltoid/labels
  label_ext: .txt
  require_labels: false
  patterns:
    - "*.png"
    - "*.jpg"
    - "*.jpeg"

  naming:
    canonicalize_names: true
    services_id: yk-002
    task_name: arm_deltoid_muscle
    filename_template: ${services_id}_${task_name}_${seq_id_padded}
    id_width: 4
    id_start: 1
    target_image_ext: .png
    materialize_mode: copy

# 不配置就是只生成real_manifest.jsonl给后一个 phase（generation）用
