run:
  run_id: body_pose_filter
  artifacts_root: artifacts/runs/yk003/body_pose

filter:
  mode: compose
  pipeline:
    phases:
      - id: phase1_dual_signal
        enabled: true
        target_source: synthetic
        prompt_accept_threshold: 0.66
        prompt_uncertain_threshold: 0.52
        pair_accept_threshold: 0.82
        pair_uncertain_threshold: 0.72
        missing_pair_policy: uncertain
        hard_reject: false

  input_manifests: 
    - artifacts/runs/yk003/body_pose_generation/body_pose__prompt/generate/synth_manifest.jsonl
    - artifacts/runs/yk003/body_pose_generation/body_pose__prompt_canny/generate/synth_manifest.jsonl

  keep_real_always: true

  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  # 补齐 guided anchor embedding：从 dataloader real manifest 自动注入缺失 real rows。
  anchor_real_manifest: artifacts/runs/yk003/body_pose/yk003_body_datanorm/dataloader/real_manifest.jsonl

  clip:
    model_id: google/siglip2-so400m-patch16-naflex # siglip2 is better model compare with “clip / siglip...”
    device: auto
    prompt_score_mode: siglip_sigmoid
    compare-texts:
      human: 
        - human 
        - person
        - human body
      body_structure:
        - human's muscale is visible
        - human's deltoid muscle is visible
        - human's elbow is visible
        - elbow
        - Normal facial structure
        - neck
        - nose
        - ear
        - hands
      negative:
        - 不是人类
        - 缺乏人类特征
        - 完全失效
    compare-texts-weights:
      human: 0.4
      body_structure: 0.6
      negative: 1.0
    compare-texts-group-reduce: max
    compare-texts-negative-scale: 1.0

  phase1_semantic:
    enabled: true
    guided_w_anchor: 0.8
    guided_w_prompt: 0.2
    prompt_metric: score
    prompt_field: prompt_text
    guided_marker_fields:
      - guide_image_id
      - anchor_real_image_path
      - effective_anchor_input
      - effective_anchor_inputs
    anchor_sid_fields:
      - guide_image_id

  phase1_dual_signal:
    enabled: true
    target_source: synthetic
    prompt_accept_threshold: 0.66
    prompt_uncertain_threshold: 0.52
    pair_accept_threshold: 0.82
    pair_uncertain_threshold: 0.72
    missing_pair_policy: uncertain
    hard_reject: false

  policy:
    decision: phase1_dual_signal
