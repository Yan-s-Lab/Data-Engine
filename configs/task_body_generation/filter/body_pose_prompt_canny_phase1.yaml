run:
  run_id: body_pose_filter2
  artifacts_root: artifacts/runs/yk003/body_pose

filter:
  mode: compose
  pipeline:
    phases:
      - id: phase1_dual_signal
        enabled: true
        target_source: synthetic
        prompt_accept_threshold: 0.66
        prompt_uncertain_threshold: 0.52
        pair_accept_threshold: 0.82
        pair_uncertain_threshold: 0.72
        missing_pair_policy: uncertain
        hard_reject: false

  input_manifests: 
    - artifacts/runs/yk003/body_pose_generation/body_pose__prompt/generate/synth_manifest.jsonl
    - artifacts/runs/yk003/body_pose_generation/body_pose__prompt_canny/generate/synth_manifest.jsonl

  keep_real_always: true

  accept_threshold: 0.72
  uncertain_low: 0.62
  uncertain_high: 0.72

  # 补齐 guided anchor embedding：从 dataloader real manifest 自动注入缺失 real rows。
  anchor_real_manifest: artifacts/runs/yk003/body_pose/yk003_body_datanorm/dataloader/real_manifest.jsonl

  clip:
    model_id: google/siglip2-so400m-patch16-naflex # siglip2 is better model compare with “clip / siglip...”
    device: auto
    prompt_score_mode: siglip_sigmoid
    compare-texts:
        positive:
          - a photo of a person
          - side view of a person
          - side view of a person's upper arm
          - side view of a person's upper arm with the deltoid region visible
          - close-up photo of a person's shoulder showing the deltoid muscle
          - exposed upper arm with the deltoid area clearly visible
          - side profile of a person's upper arm and shoulder
          - side profile view of a person's shoulder and upper arm
          - human shoulder with the upper arm visible
          - photo focusing on the shoulder and upper arm region
          - upper arm visible in a side view
          - side angle photograph of a person's shoulder and upper arm
          - close-up photo of the shoulder and upper arm
          - side view photo showing the shoulder and upper arm
          - medical-style photo of a human shoulder and upper arm
          - close-up image of the upper arm and shoulder region
        negative:
          - close-up photo of a human hand
          - image focusing on hands or fingers
          - image focusing on legs or lower body
          - close-up photo of a human face
          - portrait photo of a face
          - close-up of the neck or head
          - front view of a person
          - frontal portrait of a person
          - photo of a person's back
          - person with arms outside the frame
          - cropped image where the upper arm is not visible
          - upper arm not visible in the image
          - image where the shoulder is not visible
          - person wearing long sleeves covering the upper arm
          - shoulder and upper arm fully covered by clothes
          - arm covered by fabric or clothing
    compare-texts-weights:
      human: 0.4
      body_structure: 0.6
      negative: 1.0
    compare-texts-group-reduce: max
    compare-texts-negative-scale: 1.0

  phase1_semantic:
    enabled: true
    guided_w_anchor: 0.8
    guided_w_prompt: 0.2
    prompt_metric: score
    prompt_field: prompt_text
    guided_marker_fields:
      - guide_image_id
      - anchor_real_image_path
      - effective_anchor_input
      - effective_anchor_inputs
    anchor_sid_fields:
      - guide_image_id

  phase1_dual_signal:
    enabled: true
    target_source: synthetic
    prompt_accept_threshold: 0.66
    prompt_uncertain_threshold: 0.52
    pair_accept_threshold: 0.82
    pair_uncertain_threshold: 0.72
    missing_pair_policy: uncertain
    hard_reject: false

  policy:
    decision: phase1_dual_signal
