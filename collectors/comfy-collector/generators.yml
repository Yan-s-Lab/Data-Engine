t2i_generators:
  - id: deltoid_flux_v1
    backend: comfyui          # 对应 BACKEND_REGISTRY 的 key
    collection_name: deltoid_flux_v1
    num_images: 100
    prompt: "ultra-detailed photo of deltoid for injection training, ..."
    negative_prompt: "lowres, blurry, ..."
    seed_base: 123456
    width: 1024
    height: 1024
    backend_config:
      api_base: "http://127.0.0.1:8188"
      workflow_path: "/app/workflows/deltoid_flux_v1.json"
      # 其他 ComfyUI 专用参数
      some_param: 42
    extra_params:
      # 如果某些字段只在 backend 里用，可以放这里，在 GenerationRequest.extra 里取

  - id: deltoid_sd15_local
    backend: diffusers_local
    collection_name: deltoid_sd15_local
    num_images: 50
    prompt: "..."
    negative_prompt: "lowres, blurry, ..."
    width: 768
    height: 768
    seed_base: 2024

    backend_config:
      api_base: "runwayml/stable-diffusion-v1-5"
      workflow_path: "/app/workflows/deltoid_flux_v1.json"
      # 其他 ComfyUI 专用参数
      some_param: 42
    extra_params:
      # 如果某些字段只在 backend 里用，可以放这里，在 GenerationRequest.extra 里取

  - id: "local_comfy"
    backend: comfyui_df
    collection_name: deltoid_sd15_local
    num_images: 50
    prompt: "..."
    negative_prompt: "lowres, blurry, ..."
    width: 768
    height: 768
    seed_base: 2024

    backend_config:
      api_base: "runwayml/stable-diffusion-v1-5"
      workflow_path: "/app/workflows/deltoid_flux_v1.json"
      # 其他 ComfyUI 专用参数
      some_param: 42
    extra_params:
      # 如果某些字段只在 backend 里用，可以放这里，在 GenerationRequest.extra 里取


  - id: "local_pipeline"
    type: "diffusers"
    collection_name: deltoid_sd15_local
    num_images: 50
  
    model_id: "stabilityai/sdxl-turbo"
    device: "cuda:0"
    concurrency: 2
    num_images: 10
    prompt_template: "deltoid injection training view, pure diffusers pipeline, seed={seed}"
    seed_start: 2000
